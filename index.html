<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection closed errors in cloud proxy / iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        var file = (event && event.filename) ? String(event.filename) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('closed without opened') ||
          file.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reasonMsg = (event && event.reason && event.reason.message) ? String(event.reason.message) : String(event && event.reason);
        if (
          reasonMsg.includes('WebSocket') ||
          reasonMsg.includes('closed without opened')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
